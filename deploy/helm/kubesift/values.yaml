image:
  repository: ghcr.io/opeyemiadeniji/kubesift
  tag: ""          # defaults to the chart appVersion
  pullPolicy: IfNotPresent

# 1 replica: history in a SQLite file on a volume (simple, fine for most teams).
# 2+ replicas (high availability): set database.url (PostgreSQL). Replicas elect one leader with a
# Kubernetes Lease to run background scans; any replica serves the dashboard, API and MCP.
replicaCount: 1

database:
  url: ""   # postgresql://user:password@host:5432/kubesift (stored in the chart's Secret)
  # Or keep it in existingSecret under the key "database-url" and set:
  fromExistingSecret: false

# API token for the dashboard, API and MCP endpoint. Leave empty to generate one (see NOTES).
apiToken: ""
# Or reference an existing Secret with these keys:
#   api-token, database-url, anthropic-api-key, openai-api-key, openrouter-api-key,
#   slack-webhook-url, teams-webhook-url, slack-signing-secret, github-token
existingSecret: ""

llm:
  provider: none     # anthropic | openai | openrouter | ollama | none
  model: ""
  baseUrl: ""        # e.g. http://ollama.ollama:11434 for Ollama
  timeout: 0         # seconds to wait for one answer; 0 = default (180, Ollama 900)
  anthropicApiKey: ""
  openaiApiKey: ""
  openrouterApiKey: ""
  sendLogs: true     # false keeps log lines out of LLM prompts

prometheus:
  url: ""            # e.g. http://prometheus-operated.monitoring:9090

scan:
  interval: 300      # seconds between background scans; 0 disables (the dashboard's Live mode needs them)
  namespace: ""      # empty = all namespaces
  notifyMinSeverity: high

notifications:
  slackWebhookUrl: ""
  teamsWebhookUrl: ""
  webhookUrl: ""

# Which namespaces KubeSift covers. exclude: a regex, e.g. "^(dev-|sandbox-)" (system namespaces are already
# skipped for hygiene checks). only: serve one namespace; requests for others get 403. Note the RBAC stays
# cluster-wide read (nodes, storage classes, webhooks are cluster-scoped).
namespaces:
  exclude: ""
  only: ""

# Dashboard: the Logs button shows redacted pod logs to anyone with the API token.
dashboard:
  logs: true

# Slack on-call: `/sift` slash command and fix buttons (see docs/slack.md).
slack:
  signingSecret: ""      # from your Slack app's Basic Information page
  allowedUsers: []       # Slack user IDs allowed to apply fixes (also needs rbac.allowWrites)

# Tickets: open a GitHub issue per incident, never a duplicate (see docs/tickets.md).
tickets:
  githubRepo: ""       # owner/repo; enables the API, MCP tool and Slack "Open GitHub issue" button
  githubToken: ""      # fine-grained token with Issues: read and write (or existingSecret key github-token)
  githubApiUrl: ""     # GitHub Enterprise Server, e.g. https://ghe.example.com/api/v3
  onAlert: false        # open/update an issue for each urgent incident from alerts and background scans

rbac:
  create: true
  # Reading Secrets lets KubeSift check missing secret references, TLS expiry and Helm releases.
  # Secret VALUES are never stored or sent anywhere; only key names and certificate dates are kept.
  readSecrets: true
  # Allow guarded fixes from the API, Slack and MCP server: restart, rollback, scale, delete pod, Service
  # selector, memory limit. Every fix is dry-run first, audited and verified afterwards.
  allowWrites: false
  # Also allow the `grant` fix (a namespaced Role + RoleBinding for one verb on one resource). KubeSift can only
  # grant permissions it holds itself (Kubernetes blocks escalation), but keep this off unless you need it.
  allowRbacFixes: false

# Roll back a Deployment automatically when a rollout in the last 30 minutes broke it (crash loop, image pull,
# config error, OOM kill, stuck rollout), then verify. Needs rbac.allowWrites and scan.interval > 0.
# List the namespaces, or ["*"] for every non-system namespace. Empty = off (see docs/auto-rollback.md).
autoRollback:
  namespaces: []

persistence:
  enabled: true
  size: 1Gi
  storageClass: ""

service:
  type: ClusterIP
  port: 80

ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts:
    - host: kubesift.example.com
      paths: [{path: /, pathType: Prefix}]
  tls: []

networkPolicy:
  enabled: false

resources:
  requests: {cpu: 50m, memory: 128Mi}
  limits: {memory: 512Mi}

nodeSelector: {}
tolerations: []
affinity: {}
