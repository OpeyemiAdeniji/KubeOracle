apiVersion: v2
name: kubesift
description: Evidence-based Kubernetes troubleshooting service (dashboard, API, Alertmanager receiver, background scans)
type: application
version: 2.2.2
appVersion: "2.2.2"
home: https://opeyemiadeniji.github.io/KubeSift/
sources:
  - https://github.com/OpeyemiAdeniji/KubeSift
icon: https://raw.githubusercontent.com/OpeyemiAdeniji/KubeSift/main/website/favicon.svg
keywords: [kubernetes, troubleshooting, sre, observability, incident-response, mcp]
maintainers:
  - name: Opeyemi Adeniji
    url: https://github.com/OpeyemiAdeniji
annotations:
  # Read by Artifact Hub (https://artifacthub.io/docs/topics/annotations/helm/). The image tag must equal appVersion;
  # tests/test_release.py checks it.
  artifacthub.io/license: Apache-2.0
  artifacthub.io/category: monitoring-logging
  artifacthub.io/images: |
    - name: kubesift
      image: ghcr.io/opeyemiadeniji/kubesift:2.2.2
  artifacthub.io/links: |
    - name: Website
      url: https://opeyemiadeniji.github.io/KubeSift/
    - name: Documentation
      url: https://opeyemiadeniji.github.io/KubeSift/docs/
    - name: Production guide
      url: https://opeyemiadeniji.github.io/KubeSift/docs/production.html
  # What changed in this version (shown on Artifact Hub). Kinds: added, changed, deprecated, removed, fixed, security.
  artifacthub.io/changes: |
    - kind: fixed
      description: After a node or Docker restart, an app's own failure (for example a bad image tag) stays its own incident instead of being grouped under the node
    - kind: security
      description: Base image updated to the latest Chainguard Python (0 known vulnerabilities)
    - kind: changed
      description: krew manifest follows the krew-index rules (shorter tagline, no usage text in caveats)
    - kind: changed
      description: The code is type-checked with mypy in CI
