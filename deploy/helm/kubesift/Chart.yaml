apiVersion: v2
name: kubesift
description: Evidence-based Kubernetes troubleshooting service (dashboard, API, Alertmanager receiver, background scans)
type: application
version: 2.2.0
appVersion: "2.2.0"
home: https://opeyemiadeniji.github.io/KubeSift/
sources:
  - https://github.com/OpeyemiAdeniji/KubeSift
icon: https://raw.githubusercontent.com/OpeyemiAdeniji/KubeSift/main/website/favicon.svg
keywords: [kubernetes, troubleshooting, sre, observability, incident-response, mcp]
maintainers:
  - name: Opeyemi Adeniji
    url: https://github.com/OpeyemiAdeniji
annotations:
  # Read by Artifact Hub (https://artifacthub.io/docs/topics/annotations/helm/). The image tag must equal appVersion;
  # tests/test_release.py checks it.
  artifacthub.io/license: Apache-2.0
  artifacthub.io/category: monitoring-logging
  artifacthub.io/images: |
    - name: kubesift
      image: ghcr.io/opeyemiadeniji/kubesift:2.2.0
  artifacthub.io/links: |
    - name: Website
      url: https://opeyemiadeniji.github.io/KubeSift/
    - name: Documentation
      url: https://opeyemiadeniji.github.io/KubeSift/docs/
    - name: Production guide
      url: https://opeyemiadeniji.github.io/KubeSift/docs/production.html
  # What changed in this version (shown on Artifact Hub). Kinds: added, changed, deprecated, removed, fixed, security.
  artifacthub.io/changes: |
    - kind: added
      description: Verified fixes - after a fix KubeSift waits for the rollout, watches the pods and re-checks; kubesift verify works after any change
    - kind: added
      description: New fixes set-selector, set-memory and grant (opt-in for the service with rbac.allowRbacFixes), plus opt-in auto-rollback of a just-broken rollout (autoRollback.namespaces)
    - kind: added
      description: Incidents as GitHub issues (kubesift ticket, API, Slack button, MCP) without duplicates; tickets.* values
    - kind: added
      description: Dashboard incident map, Live mode with a Resolved list, redacted pod logs, search and filters; dashboard.logs value
    - kind: added
      description: namespaces.exclude and namespaces.only values; one-line installers for the standalone binary
    - kind: fixed
      description: Rollback skips revisions that only restarted the current version, so it no longer brings back the same broken pods
