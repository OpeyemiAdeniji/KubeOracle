apiVersion: v2
name: kubesift
description: Evidence-based Kubernetes troubleshooting service (dashboard, API, Alertmanager receiver, background scans)
type: application
version: 2.1.6
appVersion: "2.1.6"
home: https://opeyemiadeniji.github.io/KubeSift/
sources:
  - https://github.com/OpeyemiAdeniji/KubeSift
icon: https://raw.githubusercontent.com/OpeyemiAdeniji/KubeSift/main/website/favicon.svg
keywords: [kubernetes, troubleshooting, sre, observability, incident-response, mcp]
maintainers:
  - name: Opeyemi Adeniji
    url: https://github.com/OpeyemiAdeniji
annotations:
  # Read by Artifact Hub (https://artifacthub.io/docs/topics/annotations/helm/). The image tag must equal appVersion;
  # tests/test_release.py checks it.
  artifacthub.io/license: Apache-2.0
  artifacthub.io/category: monitoring-logging
  artifacthub.io/images: |
    - name: kubesift
      image: ghcr.io/opeyemiadeniji/kubesift:2.1.6
  artifacthub.io/links: |
    - name: Website
      url: https://opeyemiadeniji.github.io/KubeSift/
    - name: Documentation
      url: https://github.com/OpeyemiAdeniji/KubeSift/tree/main/docs
    - name: Production guide
      url: https://github.com/OpeyemiAdeniji/KubeSift/blob/main/docs/production.md
  # Set when the release fixes vulnerabilities in the image or its dependencies.
  artifacthub.io/containsSecurityUpdates: "true"
  # What changed in this version (shown on Artifact Hub). Kinds: added, changed, deprecated, removed, fixed, security.
  artifacthub.io/changes: |
    - kind: security
      description: The image now runs on Chainguard's Wolfi Python base with no shell or package manager; Artifact Hub's scan goes from 48 high and 98 medium findings to none
    - kind: added
      description: Standalone kubectl-sift binaries for Linux, macOS and Windows (no Python needed) and a krew manifest with every release
    - kind: changed
      description: Releases are signed with cosign 3 (Sigstore bundles) and verified in the release workflow; verify with cosign 3 or newer
    - kind: fixed
      description: MCP tools report why a call failed (cluster unreachable, not found, invalid input) instead of a bare error
    - kind: changed
      description: A brand-new Deployment reads "was created" instead of "rolled out revision 1"
