{{- include "kubesift.validate" . }}
{{- $secret := include "kubesift.secretName" . }}
{{- $externalDb := include "kubesift.externalDb" . }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "kubesift.name" . }}
  labels: {{- include "kubesift.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  strategy:
    {{- if $externalDb }}
    type: RollingUpdate
    rollingUpdate: {maxUnavailable: 0, maxSurge: 1}
    {{- else }}
    type: Recreate   # single writer to the SQLite volume
    {{- end }}
  selector:
    matchLabels: {{- include "kubesift.selector" . | nindent 6 }}
  template:
    metadata:
      labels: {{- include "kubesift.selector" . | nindent 8 }}
      annotations:
        checksum/config: {{ toJson .Values | sha256sum }}
    spec:
      serviceAccountName: {{ include "kubesift.name" . }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: kubesift
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args: [serve, --host, 0.0.0.0, --port, "8080"]
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: POD_NAME
              valueFrom: {fieldRef: {fieldPath: metadata.name}}
            - name: POD_NAMESPACE
              valueFrom: {fieldRef: {fieldPath: metadata.namespace}}
            - name: KUBESIFT_LEADER_ELECTION
              value: "true"
            {{- if $externalDb }}
            - name: KUBESIFT_DATABASE_URL
              valueFrom:
                secretKeyRef: {name: {{ $secret }}, key: database-url}
            {{- end }}
            - name: KUBESIFT_LLM_PROVIDER
              value: {{ .Values.llm.provider | quote }}
            {{- with .Values.llm.model }}
            - name: KUBESIFT_LLM_MODEL
              value: {{ . | quote }}
            {{- end }}
            {{- with .Values.llm.baseUrl }}
            - name: KUBESIFT_LLM_BASE_URL
              value: {{ . | quote }}
            {{- end }}
            - name: KUBESIFT_SEND_LOGS_TO_LLM
              value: {{ .Values.llm.sendLogs | quote }}
            {{- with .Values.prometheus.url }}
            - name: KUBESIFT_PROMETHEUS_URL
              value: {{ . | quote }}
            {{- end }}
            - name: KUBESIFT_SCAN_INTERVAL
              value: {{ .Values.scan.interval | quote }}
            {{- with .Values.scan.namespace }}
            - name: KUBESIFT_SCAN_NAMESPACE
              value: {{ . | quote }}
            {{- end }}
            - name: KUBESIFT_NOTIFY_MIN_SEVERITY
              value: {{ .Values.scan.notifyMinSeverity | quote }}
            - name: KUBESIFT_ALLOW_WRITES
              value: {{ .Values.rbac.allowWrites | quote }}
            {{- with .Values.slack.allowedUsers }}
            - name: KUBESIFT_SLACK_ALLOWED_USERS
              value: {{ join "," . | quote }}
            {{- end }}
            {{- with .Values.notifications.webhookUrl }}
            - name: KUBESIFT_WEBHOOK_URL
              value: {{ . | quote }}
            {{- end }}
            {{- range $env, $key := dict "KUBESIFT_API_TOKEN" "api-token" "ANTHROPIC_API_KEY" "anthropic-api-key" "OPENAI_API_KEY" "openai-api-key" "OPENROUTER_API_KEY" "openrouter-api-key" "KUBESIFT_SLACK_WEBHOOK_URL" "slack-webhook-url" "KUBESIFT_TEAMS_WEBHOOK_URL" "teams-webhook-url" "KUBESIFT_SLACK_SIGNING_SECRET" "slack-signing-secret" }}
            - name: {{ $env }}
              valueFrom:
                secretKeyRef:
                  name: {{ $secret }}
                  key: {{ $key }}
                  optional: {{ ne $env "KUBESIFT_API_TOKEN" }}
            {{- end }}
          readinessProbe:
            httpGet: {path: /readyz, port: http}
            periodSeconds: 10
          livenessProbe:
            httpGet: {path: /healthz, port: http}
            periodSeconds: 20
            failureThreshold: 6
          startupProbe:
            httpGet: {path: /healthz, port: http}
            periodSeconds: 3
            failureThreshold: 30
          resources: {{- toYaml .Values.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: data
              mountPath: /data
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: data
          {{- if and .Values.persistence.enabled (not $externalDb) }}
          persistentVolumeClaim:
            claimName: {{ include "kubesift.name" . }}
          {{- else }}
          emptyDir: {}
          {{- end }}
        - name: tmp
          emptyDir: {}
      {{- if gt (int .Values.replicaCount) 1 }}
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels: {{- include "kubesift.selector" . | nindent 14 }}
      {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector: {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations: {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity: {{- toYaml . | nindent 8 }}
      {{- end }}
