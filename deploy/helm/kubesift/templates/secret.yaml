{{- if not .Values.existingSecret }}
{{- $existing := lookup "v1" "Secret" .Release.Namespace (include "kubesift.name" .) }}
{{- $token := .Values.apiToken }}
{{- if and (not $token) $existing }}
{{- $token = index $existing.data "api-token" | b64dec }}
{{- end }}
{{- if not $token }}
{{- $token = randAlphaNum 40 }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "kubesift.name" . }}
  labels: {{- include "kubesift.labels" . | nindent 4 }}
type: Opaque
stringData:
  api-token: {{ $token | quote }}
  database-url: {{ .Values.database.url | quote }}
  anthropic-api-key: {{ .Values.llm.anthropicApiKey | quote }}
  openai-api-key: {{ .Values.llm.openaiApiKey | quote }}
  openrouter-api-key: {{ .Values.llm.openrouterApiKey | quote }}
  slack-webhook-url: {{ .Values.notifications.slackWebhookUrl | quote }}
  teams-webhook-url: {{ .Values.notifications.teamsWebhookUrl | quote }}
  slack-signing-secret: {{ .Values.slack.signingSecret | quote }}
  github-token: {{ .Values.tickets.githubToken | quote }}
{{- end }}
