apiVersion: apps/v1
kind: Deployment
metadata:
  name: pending-test
  namespace: default
  labels:
    scenario: pending-resources
spec:
  replicas: 1
  selector:
    matchLabels:
      app: pending-test
  template:
    metadata:
      labels:
        app: pending-test
    spec:
      containers:
        - name: app
          image: nginx:stable
          resources:
            requests:
              memory: "999Gi"
              cpu: "999"
            limits:
              memory: "999Gi"
              cpu: "999"
