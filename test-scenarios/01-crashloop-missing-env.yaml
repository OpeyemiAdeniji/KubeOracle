apiVersion: apps/v1
kind: Deployment
metadata:
  name: crashloop-test
  namespace: default
  labels:
    scenario: crashloop-missing-env
spec:
  replicas: 1
  selector:
    matchLabels:
      app: crashloop-test
  template:
    metadata:
      labels:
        app: crashloop-test
    spec:
      containers:
        - name: app
          image: python:3.12-slim
          command: ["python", "-c", "import os; print(os.environ['DATABASE_URL'])"]
          resources:
            limits:
              memory: "64Mi"
              cpu: "100m"
