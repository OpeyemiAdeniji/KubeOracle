apiVersion: apps/v1
kind: Deployment
metadata:
  name: selector-test
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: selector-test
  template:
    metadata:
      labels:
        app: selector-test
    spec:
      containers:
        - name: app
          image: nginx:stable
          ports:
            - containerPort: 80
          resources:
            limits:
              memory: "64Mi"
              cpu: "100m"
---
apiVersion: v1
kind: Service
metadata:
  name: selector-test-svc
  namespace: default
spec:
  selector:
    app: wrong-label-intentionally
  ports:
    - port: 80
      targetPort: 80
