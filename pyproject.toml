[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "kubesift"
dynamic = ["version"]
description = "Kubernetes troubleshooting that explains itself: evidence-based diagnosis, change correlation, cost and upgrade checks. CLI, kubectl plugin, MCP server and in-cluster service."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "Opeyemi Adeniji" }]
keywords = ["kubernetes", "k8s", "troubleshooting", "sre", "devops", "mcp", "llm", "kubectl-plugin"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: System Administrators",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Operating System :: OS Independent",
  "Topic :: System :: Monitoring",
  "Topic :: System :: Systems Administration",
]
dependencies = [
  "kubernetes>=31",
  "typer>=0.12",
  "rich>=13",
  "pyyaml>=6",
  "httpx>=0.27",
  "pydantic>=2.7",
  "cryptography>=42",
]

[project.optional-dependencies]
server = ["fastapi>=0.110", "uvicorn[standard]>=0.29"]
mcp = ["mcp>=2,<3"]
anthropic = ["anthropic>=2.8"]
postgres = ["psycopg[binary]>=3.1"]
all = ["kubesift[server,mcp,anthropic,postgres]"]
dev = ["kubesift[all]", "pytest>=8", "ruff>=0.6", "pytest-cov>=5", "jsonschema>=4"]

[project.scripts]
kubesift = "kubesift.cli:main"
kubectl-sift = "kubesift.cli:main"

[project.urls]
Homepage = "https://github.com/OpeyemiAdeniji/KubeSift"
Issues = "https://github.com/OpeyemiAdeniji/KubeSift/issues"

[tool.hatch.version]
path = "src/kubesift/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/kubesift"]

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
ignore = ["E501", "B008"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
