name: KubeSift lint
description: Check Kubernetes manifests, Helm charts and Kustomize output for reliability, security and removed-API problems.
branding:
  icon: shield
  color: purple
inputs:
  paths:
    description: Space-separated files or directories to lint
    default: "."
  target-version:
    description: Kubernetes version to check removed APIs against (e.g. 1.36)
    default: ""
  fail-on:
    description: Fail the step at or above this severity (critical, high, medium, low, none)
    default: high
  sarif:
    description: Upload results to GitHub code scanning (needs security-events write permission)
    default: "true"
outputs:
  sarif-file:
    description: Path of the SARIF report, written even when the step fails
    value: ${{ steps.lint.outputs.sarif-file }}
runs:
  using: composite
  steps:
    - uses: actions/setup-python@v7
      with:
        python-version: "3.12"
    # Install KubeSift from the action's own checkout, so `@v2`, `@v2.1.4` or `@<sha>` run exactly that version
    # (and `uses: ./` in this repository tests the code in the pull request).
    - shell: bash
      run: pip install --quiet "$ACTION_PATH"
      env:
        ACTION_PATH: ${{ github.action_path }}
    - id: lint
      shell: bash
      env:  # inputs reach the script as data, never as shell code
        PATHS: ${{ inputs.paths }}
        TARGET: ${{ inputs.target-version }}
        FAIL_ON: ${{ inputs.fail-on }}
      run: |
        set -f  # paths are split on spaces but never glob-expanded
        args=()
        if [ -n "$TARGET" ]; then args+=(--target-version "$TARGET"); fi
        sarif="$GITHUB_WORKSPACE/kubesift.sarif"  # same place as before, for workflows that read it
        echo "sarif-file=$sarif" >> "$GITHUB_OUTPUT"
        # shellcheck disable=SC2086
        kubesift lint $PATHS "${args[@]}" -o sarif --fail-on none > "$sarif"
        # shellcheck disable=SC2086
        kubesift lint $PATHS "${args[@]}" --fail-on "$FAIL_ON"
    - if: always() && inputs.sarif == 'true' && steps.lint.outputs.sarif-file != ''
      uses: github/codeql-action/upload-sarif@v4
      with:
        sarif_file: ${{ steps.lint.outputs.sarif-file }}
        category: kubesift
