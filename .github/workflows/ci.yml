name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: kubesift
          POSTGRES_DB: kubesift
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      KUBESIFT_TEST_DATABASE_URL: postgresql://postgres:kubesift@localhost:5432/kubesift
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.11", "3.12", "3.13", "3.14", "3.15"]  # the image runs the newest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: pip install -e ".[dev]"
      - run: ruff check src tests
      - run: pytest --cov=kubesift --cov-report=term-missing

  workflows:
    # A broken workflow file is only noticed when it runs; for the release workflow that is too late.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: actionlint
        run: |
          bash <(curl -sSfL https://raw.githubusercontent.com/rhysd/actionlint/v1.7.12/scripts/download-actionlint.bash) 1.7.12
          ./actionlint -color
      - name: Every action version used exists (actionlint does not check; v2.1.6's release failed on this)
        run: scripts/check_action_refs.sh

  action:
    # Runs the published GitHub Action (action.yml) the way users do, so a broken action is caught before release.
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write  # SARIF upload, as users run it
    steps:
      - uses: actions/checkout@v7
      - name: A healthy chart passes
        uses: ./
        with:
          paths: deploy/helm/kubesift
          target-version: "1.36"
          fail-on: medium
          sarif: "false"
      - name: Broken manifests fail the step
        id: broken
        continue-on-error: true
        uses: ./
        with:
          paths: test-scenarios/01-crashloop-missing-env.yaml test-scenarios/09-netpol-blocks-dns.yaml  # 09 is high
          fail-on: high
          # Upload only on this repo's own pull requests: on main the deliberately broken test files would become
          # open alerts in the Security tab (and fork PRs have no permission to upload).
          sarif: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository }}
      - name: Check the outcome and the SARIF report
        env:
          OUTCOME: ${{ steps.broken.outcome }}
          SARIF: ${{ steps.broken.outputs.sarif-file }}
        run: |
          test "$OUTCOME" = failure || { echo "broken manifests should fail the step, got $OUTCOME"; exit 1; }
          python3 - "$SARIF" <<'EOF'
          import json, sys
          results = json.load(open(sys.argv[1]))["runs"][0]["results"]
          assert results, "the SARIF report has no results"
          print(len(results), "results; rules:", sorted({r["ruleId"] for r in results}))
          EOF

  oldest-deps:
    # The Kubernetes client changed its low-level API in v37; keep supporting older releases.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.10"
      - run: pip install -e ".[dev]" "kubernetes==31.0.0"
      - run: pytest -q

  chart:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: azure/setup-helm@v5
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install -e .
      - run: helm lint deploy/helm/kubesift
      # Dogfooding: the chart must pass KubeSift's own checks, in both modes.
      - run: helm template ko deploy/helm/kubesift | kubesift lint - --fail-on medium
      - run: |
          helm template ko deploy/helm/kubesift --set replicaCount=2 --set database.url=postgresql://u:p@db/k             | kubesift lint - --fail-on medium
      - name: Two replicas without a shared database must be rejected
        run: |
          if helm template ko deploy/helm/kubesift --set replicaCount=2 >/dev/null 2>&1; then
            echo "expected a validation error"; exit 1
          fi

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          tags: kubesift:ci
          load: true
      - run: docker run --rm kubesift:ci version
      - name: Every extra imports (the image has no shell or pip to fix things later)
        run: docker run --rm --entrypoint python kubesift:ci -c "import kubesift.mcp_server, kubesift.server.app, anthropic, psycopg, uvicorn"
      - name: Serves the way the chart runs it (uid 10001, read-only root, /data volume)
        run: |
          docker run -d --name ks --read-only --user 10001 -e KUBESIFT_API_TOKEN=ci -v ksdata:/data -p 8080:8080 kubesift:ci
          for _ in $(seq 30); do curl -sf localhost:8080/healthz && break; sleep 1; done
          curl -sf localhost:8080/healthz
          test "$(curl -s -o /dev/null -w '%{http_code}' localhost:8080/api/v1/history)" = 401
          docker rm -f ks
      - name: No fixable high or critical vulnerabilities (Artifact Hub runs the same scanner)
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock aquasec/trivy:0.69.3 image \
            --scanners vuln,secret --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 kubesift:ci

  binary:
    # The standalone kubectl-sift (krew) must build and pass its smoke test before a release depends on it.
    strategy:
      matrix:
        include:
          - {os: linux, runner: ubuntu-latest, container: "quay.io/pypa/manylinux_2_28_x86_64"}
          - {os: windows, runner: windows-latest}
    runs-on: ${{ matrix.runner }}
    container: ${{ matrix.container }}
    steps:
      - uses: actions/checkout@v7
      - if: matrix.os == 'linux'
        run: scripts/build_binary_manylinux.sh
      - uses: actions/setup-python@v7
        if: matrix.os != 'linux'
        with:
          python-version: "3.12"
      - if: matrix.os != 'linux'
        shell: bash
        run: |
          python -m pip install ".[anthropic]" "pyinstaller==6.22.3"
          python scripts/build_binary.py
      - name: The krew manifest is valid YAML with every field filled
        if: matrix.os == 'linux'
        run: |
          for p in linux_arm64.tar.gz darwin_amd64.tar.gz darwin_arm64.tar.gz windows_amd64.zip; do
            echo "$(printf 'ab%.0s' $(seq 32))  x" > "dist/kubectl-sift_$p.sha256"
          done
          /tmp/kubesift-build/bin/python scripts/krew_manifest.py v0.0.0 dist
          /tmp/kubesift-build/bin/python -c "import yaml; m = yaml.safe_load(open('dist/sift.yaml')); assert len(m['spec']['platforms']) == 5 and all(len(p['sha256']) == 64 for p in m['spec']['platforms'])"

  e2e:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install -e .
      - uses: helm/kind-action@v1
        with:
          cluster_name: kubesift-e2e
      - name: Break the cluster on purpose and check every failure is explained
        run: CLUSTER=kubesift-e2e ./scripts/e2e.sh
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: e2e-report
          path: e2e-report.json

  deploy:
    # Install the Helm chart on a real cluster: single replica, then HA with PostgreSQL and leader election.
    runs-on: ubuntu-latest
    needs: [test, docker]
    steps:
      - uses: actions/checkout@v7
      - uses: azure/setup-helm@v5
      - uses: helm/kind-action@v1
        with:
          cluster_name: kubesift-deploy
      - name: Build the image and load it into kind
        run: |
          docker build -t ghcr.io/opeyemiadeniji/kubesift:ci .
          kind load docker-image ghcr.io/opeyemiadeniji/kubesift:ci --name kubesift-deploy
      - name: Single replica
        run: |
          helm install ko deploy/helm/kubesift -n kubesift --create-namespace             --set image.tag=ci --set image.pullPolicy=Never --set scan.interval=30 --wait --timeout 3m
          kubectl -n kubesift port-forward svc/ko-kubesift 8080:80 & sleep 5
          TOKEN=$(kubectl -n kubesift get secret ko-kubesift -o jsonpath='{.data.api-token}' | base64 -d)
          curl -fsS localhost:8080/healthz
          curl -fsS -H "Authorization: Bearer $TOKEN" localhost:8080/api/v1/info
          code=$(curl -s -o /dev/null -w '%{http_code}' -X POST localhost:8080/mcp -H 'Content-Type: application/json' -d '{}')
          test "$code" = 401
          curl -fsS -X POST -H "Authorization: Bearer $TOKEN" -H 'Content-Type: application/json'             localhost:8080/api/v1/diagnose -d '{"llm": false}' | python3 -c 'import json,sys; r=json.load(sys.stdin); print(r["cluster"], len(r["findings"]), "findings")'
          kill %1
          helm uninstall ko -n kubesift --wait
      - name: Two replicas with PostgreSQL and leader election
        run: |
          kubectl -n kubesift create deployment pg --image=postgres:16-alpine --port=5432
          kubectl -n kubesift set env deployment/pg POSTGRES_PASSWORD=pw POSTGRES_DB=kubesift
          kubectl -n kubesift expose deployment pg --port=5432
          kubectl -n kubesift rollout status deployment/pg --timeout=120s
          helm install ko deploy/helm/kubesift -n kubesift --set image.tag=ci --set image.pullPolicy=Never             --set replicaCount=2 --set database.url=postgresql://postgres:pw@pg:5432/kubesift             --set scan.interval=30 --wait --timeout 4m
          kubectl -n kubesift get pods -o wide
          # The lease must end up held by one of the running replicas (a previous holder may need to expire).
          pods=$(kubectl -n kubesift get pods -l app.kubernetes.io/name=kubesift -o jsonpath='{.items[*].metadata.name}')
          for _ in $(seq 1 30); do
            holder=$(kubectl -n kubesift get lease kubesift-scanner -o jsonpath='{.spec.holderIdentity}' 2>/dev/null || true)
            if [ -n "$holder" ] && echo " $pods " | grep -q " $holder "; then break; fi
            sleep 3
          done
          echo "replicas: $pods"; echo "leader: $holder"
          echo " $pods " | grep -q " $holder "
      - name: Killing the leader hands over to the other replica
        run: |
          old=$(kubectl -n kubesift get lease kubesift-scanner -o jsonpath='{.spec.holderIdentity}')
          kubectl -n kubesift delete pod "$old" --wait=false
          for i in $(seq 1 30); do
            holder=$(kubectl -n kubesift get lease kubesift-scanner -o jsonpath='{.spec.holderIdentity}')
            if [ -n "$holder" ] && [ "$holder" != "$old" ]; then echo "failover: $old -> $holder after ~$((i*2))s"; exit 0; fi
            sleep 2
          done
          echo "no failover"; exit 1
      - if: failure()
        run: kubectl -n kubesift logs -l app.kubernetes.io/name=kubesift --tail=100 --prefix || true
