name: Website

on:
  push:
    branches: [main]
    paths: ["website/**", "docs/**", "mkdocs.yml", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/configure-pages@v6
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Landing page at /, docs site at /docs/
        env:
          NO_MKDOCS_2_WARNING: "1"
        run: |
          pip install "mkdocs==1.6.1" "mkdocs-material==9.8.1"
          mkdocs build --strict --site-dir _site/docs
          cp -r website/. _site/
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v5
