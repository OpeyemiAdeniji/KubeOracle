name: Artifact Hub metadata

# Publishes deploy/helm/artifacthub-repo.yml next to the OCI chart so Artifact Hub marks the repository as a
# verified publisher. Runs when the file changes on main, or by hand from the Actions tab.

on:
  push:
    branches: [main]
    paths: [deploy/helm/artifacthub-repo.yml]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oras-project/setup-oras@v2
      - name: Push artifacthub-repo.yml to the chart repository
        run: |
          owner=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')  # OCI names must be lowercase
          echo "${{ secrets.GITHUB_TOKEN }}" | oras login ghcr.io -u "${{ github.actor }}" --password-stdin
          cd deploy/helm
          oras push "ghcr.io/${owner}/charts/kubesift:artifacthub.io" \
            --config /dev/null:application/vnd.cncf.artifacthub.config.v1+yaml \
            artifacthub-repo.yml:application/vnd.cncf.artifacthub.repository-metadata.layer.v1.yaml
