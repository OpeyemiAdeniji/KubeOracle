<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>KubeSift</title>
<style>
:root{--bg:#f6f7f9;--panel:#fff;--text:#1b1f24;--muted:#5d6672;--line:#e3e6ea;--accent:#4b5bdc;
--crit:#c62828;--high:#e65100;--med:#b58900;--low:#0277bd;--info:#6b7280;--ok:#2e7d32;--code:#f0f2f5}
@media (prefers-color-scheme:dark){:root{--bg:#0f1216;--panel:#171b21;--text:#e6e9ee;--muted:#9aa4b2;--line:#262c35;
--accent:#8b96ff;--code:#1f252d;--crit:#ef5350;--high:#ff8a50;--med:#e0c050;--low:#4fc3f7;--ok:#66bb6a}}
*{box-sizing:border-box}body{margin:0;font:14px/1.5 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--text)}
header{display:flex;gap:16px;align-items:center;padding:12px 20px;border-bottom:1px solid var(--line);background:var(--panel);flex-wrap:wrap}
header h1{font-size:17px;margin:0}header .meta{color:var(--muted);font-size:12px}
nav{display:flex;gap:4px;flex-wrap:wrap}nav button{background:none;border:0;padding:6px 12px;border-radius:6px;color:var(--muted);cursor:pointer;font:inherit}
nav button.on{background:var(--code);color:var(--text);font-weight:600}
main{max-width:1180px;margin:0 auto;padding:20px 16px}
.bar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px;align-items:center}
input,select,textarea{font:inherit;padding:7px 10px;border:1px solid var(--line);border-radius:6px;background:var(--panel);color:var(--text)}
textarea{width:100%;min-height:220px;font-family:ui-monospace,Consolas,monospace;font-size:12px}
button.go{background:var(--accent);color:#fff;border:0;padding:8px 14px;border-radius:6px;cursor:pointer;font-weight:600}
button.go:disabled{opacity:.5;cursor:wait}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:16px;margin-bottom:14px}
.card h3{margin:0 0 6px;font-size:15px}.muted{color:var(--muted)}
.sev{display:inline-block;min-width:68px;text-align:center;font-size:11px;font-weight:700;padding:2px 6px;border-radius:4px;color:#fff;text-transform:uppercase}
.critical{background:var(--crit)}.high{background:var(--high)}.medium{background:var(--med)}.low{background:var(--low)}.info{background:var(--info)}
table{width:100%;border-collapse:collapse}td,th{text-align:left;padding:8px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:12px;color:var(--muted);font-weight:600}
code,pre{font-family:ui-monospace,Consolas,monospace;font-size:12px;background:var(--code);border-radius:4px}
code{padding:1px 5px}pre{padding:8px;white-space:pre-wrap;word-break:break-word;margin:6px 0}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin-bottom:14px}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px}.stat b{font-size:22px;display:block}
.change{border-left:3px solid var(--accent);padding-left:8px;margin:6px 0}
.ok{color:var(--ok);font-weight:600}.err{color:var(--crit)}details summary{cursor:pointer;color:var(--muted)}
@media (max-width:640px){td,th{padding:6px 4px}.hide-sm{display:none}}
.filters{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:0 0 14px}
.filters input[type=search]{flex:1;min-width:180px}
.chip{border:1px solid var(--line);background:var(--panel);color:var(--muted);border-radius:999px;padding:3px 10px;cursor:pointer;font:inherit;font-size:12px}
.chip.on{color:var(--text);border-color:var(--accent);font-weight:600}
button.mini{background:var(--code);color:var(--text);border:1px solid var(--line);border-radius:6px;padding:3px 10px;cursor:pointer;font:inherit;font-size:12px}
.inc{border-left:4px solid var(--line)}.inc-critical{border-left-color:var(--crit)}.inc-high{border-left-color:var(--high)}
.inc-medium{border-left-color:var(--med)}.inc-low{border-left-color:var(--low)}
.inc .sev{min-width:60px}.inc-head{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.acts{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.map{overflow-x:auto;margin-top:10px;border:1px solid var(--line);border-radius:8px;background:var(--bg)}
.map svg{display:block}.legend{font-size:12px;color:var(--muted);padding:6px 10px;border-top:1px solid var(--line)}
.live-dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--ok);margin-right:6px;animation:pulse 2s infinite}
@keyframes pulse{50%{opacity:.3}}@media (prefers-reduced-motion:reduce){.live-dot{animation:none}}
.resolved{opacity:.75}.resolved b{text-decoration:line-through}
dialog{border:1px solid var(--line);border-radius:10px;background:var(--panel);color:var(--text);width:min(1000px,95vw);padding:0}
dialog::backdrop{background:rgba(0,0,0,.5)}.dlg-head{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:10px 14px;border-bottom:1px solid var(--line)}
.logs{max-height:65vh;overflow:auto;margin:0;border-radius:0;font-size:12px}.logs .e{color:var(--crit)}
</style>
</head>
<body>
<header>
  <h1>KubeSift</h1><span class="meta" id="meta"></span>
  <nav id="nav"></nav>
</header>
<main id="main"></main>
<dialog id="logs" aria-label="Pod logs"><div class="dlg-head"><b id="logs-title"></b><select id="logs-c" aria-label="Container"></select>
<label><input type="checkbox" id="logs-prev"> previous container</label><button class="mini" id="logs-close" style="margin-left:auto">Close</button></div>
<pre class="logs" id="logs-body"></pre></dialog>
<script>
const TABS = ["Diagnose", "Ask", "Changes", "Cost", "Upgrade", "Lint", "History"];
const $ = (s, el = document) => el.querySelector(s);
const esc = v => String(v ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
let token = ""; try { token = sessionStorage.getItem("ko-token") || ""; } catch (e) {}
let current = "Diagnose";
let INFO = {};
const filt = {q: "", sev: new Set(["critical", "high", "medium", "low"]), ns: ""};
let lastReport = null, live = null;

async function api(path, opts = {}) {
  const headers = {"Content-Type": "application/json"};
  if (token) headers.Authorization = "Bearer " + token;
  const r = await fetch(path, {...opts, headers});
  if (r.status === 401) {
    token = prompt("API token (KUBESIFT_API_TOKEN):") || "";
    try { sessionStorage.setItem("ko-token", token); } catch (e) {}
    return api(path, opts);
  }
  const body = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(body.detail || r.statusText);
  return body;
}

function nav() {
  $("#nav").innerHTML = TABS.map(t => `<button class="${t === current ? "on" : ""}" data-t="${t}">${t}</button>`).join("");
  $("#nav").querySelectorAll("button").forEach(b => b.onclick = () => { current = b.dataset.t; nav(); render(); });
}
const sev = s => `<span class="sev ${esc(s)}">${esc(s)}</span>`;
const nsInput = `<input id="ns" placeholder="namespace (all)" size="16">`;
async function run(btn, fn) {
  btn.disabled = true; const out = $("#out"); out.innerHTML = `<p class="muted">Working…</p>`;
  try { await fn(out); } catch (e) { out.innerHTML = `<p class="err">${esc(e.message)}</p>`; }
  btn.disabled = false;
}

function findingRows(fs) {
  if (!fs.length) return `<p class="ok">✓ Nothing found.</p>`;
  return `<table><tr><th>Severity</th><th>Resource</th><th>Finding</th></tr>` + fs.map(f => `<tr><td>${sev(f.severity)}</td>
  <td><code>${esc(f.owner ? `${f.owner.kind}/${f.owner.namespace || ""}/${f.owner.name}` : f.resource.name)}</code><div class="muted">${esc(f.check)}</div>
  ${f.resource.kind === "Pod" && INFO.dashboard_logs ? `<button class="mini" data-logs="${esc(f.resource.namespace)}/${esc(f.resource.name)}">Logs</button>` : ""}</td>
  <td>${esc(f.message)}${(f.related_changes || []).slice(0,1).map(c => `<div class="change">after: ${esc(c.summary)}</div>`).join("")}
  <details><summary>evidence &amp; fix</summary>${(f.evidence||[]).map(e => `<div class="muted">• ${esc(e)}</div>`).join("")}
  ${f.remediation ? `<p><b>Fix:</b> ${esc(f.remediation)}</p>` : ""}${(f.commands||[]).map(c => `<pre>${esc(c)}</pre>`).join("")}
  ${(f.notes||[]).map(n => `<div>📝 ${esc(n)}</div>`).join("")}</details></td></tr>`).join("") + `</table>`;
}

function diagnosisCard(d) {
  if (!d) return "";
  return `<div class="card"><h3>Diagnosis <span class="muted">(${esc(d.generated_by)})</span></h3><p>${esc(d.summary)}</p>` +
    d.root_causes.map((rc, i) => `<div class="card"><b>${i + 1}. ${esc(rc.title)}</b> <span class="muted">${rc.confidence}% confidence</span>
    <p>${esc(rc.explanation)}</p>${rc.fix_steps.map(s => `<div>→ ${esc(s)}</div>`).join("")}${rc.commands.map(c => `<pre>${esc(c)}</pre>`).join("")}</div>`).join("") +
    (d.next_checks.length ? `<p class="muted">Next: ${d.next_checks.map(esc).join("; ")}</p>` : "") + `</div>`;
}

// ---------------------------------------------------------------- filters (search, severity, namespace)
const nsOf = x => (x.owner && x.owner.namespace) || (x.resource && x.resource.namespace) || (x.root && x.root.namespace) || "";
const matchQ = (...parts) => !filt.q || parts.join(" ").toLowerCase().includes(filt.q.toLowerCase());
const keepFinding = f => filt.sev.has(f.severity) && (!filt.ns || nsOf(f) === filt.ns) &&
  matchQ(f.check, f.message, f.resource && f.resource.name, f.owner && f.owner.name);
const keepIncident = i => filt.sev.has(i.severity) && (!filt.ns || nsOf(i) === filt.ns) &&
  matchQ(i.title, i.root && i.root.name, i.message || "", ...(Array.isArray(i.findings) ? i.findings.map(f => f.check + " " + f.message) : []));
function filterBar(namespaces) {
  return `<div class="filters" role="search"><input type="search" id="f-q" placeholder="Search name, check or message" value="${esc(filt.q)}" aria-label="Search">` +
    ["critical", "high", "medium", "low"].map(k => `<button class="chip ${filt.sev.has(k) ? "on" : ""}" data-sev="${k}" aria-pressed="${filt.sev.has(k)}">${k}</button>`).join("") +
    (namespaces.length > 1 ? `<select id="f-ns" aria-label="Namespace"><option value="">all namespaces</option>${namespaces.map(n => `<option ${n === filt.ns ? "selected" : ""}>${esc(n)}</option>`).join("")}</select>` : "") + `</div>`;
}
function bindFilters(root, rerender) {
  const q = $("#f-q", root); if (q) q.oninput = () => { filt.q = q.value; rerender(); const n = $("#f-q", root); if (n) { n.focus(); n.setSelectionRange(n.value.length, n.value.length); } };
  root.querySelectorAll("[data-sev]").forEach(b => b.onclick = () => { const k = b.dataset.sev; filt.sev.has(k) ? filt.sev.delete(k) : filt.sev.add(k); rerender(); });
  const ns = $("#f-ns", root); if (ns) ns.onchange = () => { filt.ns = ns.value; rerender(); };
}

// ---------------------------------------------------------------- incidents and the incident map
const MAPPABLE = new Set(["Deployment", "StatefulSet", "DaemonSet", "Service", "Pod"]);
function incidentCard(i, extra = "") {
  const root = i.root || {};
  const msg = i.message || ((i.findings || [])[0] || {}).message || "";
  const trig = i.trigger !== undefined ? i.trigger : (i.likely_trigger ? i.likely_trigger.summary : null);
  const rb = i.rollback !== undefined ? i.rollback : (i.likely_trigger ? i.likely_trigger.rollback_command : null);
  const n = i.findings ? (Array.isArray(i.findings) ? i.findings.length : i.findings) : 0;
  return `<div class="card inc inc-${esc(i.severity)}"><div class="inc-head">${sev(i.severity)}<b>${esc(i.title)}</b><span class="muted">${esc(i.layer || "")} · ${n} finding(s)</span>${extra}</div>
    <p>${esc(msg)}</p>${trig ? `<div class="change">after: ${esc(trig)}</div>` : ""}${rb ? `<pre>${esc(rb)}</pre>` : ""}
    <div class="acts">${MAPPABLE.has(root.kind) && root.namespace ? `<button class="mini" data-map="${esc(root.kind)}|${esc(root.namespace)}|${esc(root.name)}" aria-expanded="false">Map</button>` : ""}
    <code class="muted">kubesift verify ${esc((root.kind || "").toLowerCase())}/${esc(root.name || "")} -n ${esc(root.namespace || "default")}</code></div><div class="map-holder"></div></div>`;
}
const COLORS = {ok: "var(--line)", warn: "var(--med)", bad: "var(--crit)"};
function mapSvg(m) {
  if (m.error) return `<p class="muted" style="padding:10px">${esc(m.error)}</p>`;
  const cols = [...new Set(m.nodes.map(n => n.column))].sort((a, b) => a - b);
  const colIx = Object.fromEntries(cols.map((c, i) => [c, i]));
  const W = 200, H = 52, GAP = 14, PAD = 12, NODE_W = 168, pos = {}, rows = {};
  m.nodes.forEach(n => { const c = colIx[n.column]; rows[c] = (rows[c] || 0); pos[n.id] = {x: PAD + c * W, y: PAD + rows[c] * (H + GAP)}; rows[c]++; });
  const height = PAD * 2 + Math.max(1, ...Object.values(rows)) * (H + GAP) - GAP, width = PAD * 2 + cols.length * W - (W - NODE_W);
  const cut = (t, k) => t.length > k ? t.slice(0, k - 1) + "…" : t;
  const edges = m.edges.map(e => { const a = pos[e.from], b = pos[e.to]; if (!a || !b) return "";
    const x1 = a.x + NODE_W, y1 = a.y + H / 2, x2 = b.x, y2 = b.y + H / 2, mx = (x1 + x2) / 2;
    return `<path d="M${x1} ${y1} C${mx} ${y1} ${mx} ${y2} ${x2} ${y2}" fill="none" stroke="${COLORS[e.status]}" stroke-width="${e.status === "bad" ? 2.5 : 1.5}" ${e.status === "bad" ? 'stroke-dasharray="6 4"' : ""}><title>${esc(e.label || e.status)}</title></path>` +
      (e.label ? `<text x="${mx}" y="${(y1 + y2) / 2 - 6}" font-size="11" text-anchor="middle" fill="var(--crit)">${esc(cut(e.label, 26))}</text>` : ""); }).join("");
  const nodes = m.nodes.map(n => { const p = pos[n.id]; return `<g><title>${esc(n.kind)} ${esc(n.name)}${n.detail ? " — " + esc(n.detail) : ""}</title>
    <rect x="${p.x}" y="${p.y}" width="${NODE_W}" height="${H}" rx="8" fill="var(--panel)" stroke="${n.status === "ok" ? "var(--line)" : COLORS[n.status]}" stroke-width="${n.status === "ok" ? 1 : 2}"/>
    <rect x="${p.x}" y="${p.y}" width="5" height="${H}" rx="2" fill="${n.status === "ok" ? "var(--ok)" : COLORS[n.status]}"/>
    <text x="${p.x + 14}" y="${p.y + 16}" font-size="11" fill="var(--muted)">${esc(n.kind)}</text>
    <text x="${p.x + 14}" y="${p.y + 31}" font-size="13" font-weight="600" fill="var(--text)">${esc(cut(n.name, 21))}</text>
    <text x="${p.x + 14}" y="${p.y + 45}" font-size="11" fill="${n.status === "ok" ? "var(--muted)" : COLORS[n.status]}">${esc(cut(n.detail || "", 25))}</text></g>`; }).join("");
  return `<svg viewBox="0 0 ${width} ${height}" width="${width}" height="${height}" role="img" aria-label="Incident map">${edges}${nodes}</svg>
    <div class="legend">Green: healthy · yellow: degraded · <span class="err">red dashed: the broken link</span>. Hover for details.</div>`;
}
async function toggleMap(btn) {
  const holder = btn.closest(".inc").querySelector(".map-holder");
  if (holder.innerHTML) { holder.innerHTML = ""; btn.setAttribute("aria-expanded", "false"); return; }
  const [kind, ns, name] = btn.dataset.map.split("|");
  holder.innerHTML = `<p class="muted">Drawing the map…</p>`;
  try { holder.innerHTML = `<div class="map">${mapSvg(await api(`/api/v1/map?namespace=${encodeURIComponent(ns)}&kind=${encodeURIComponent(kind)}&name=${encodeURIComponent(name)}`))}</div>`; btn.setAttribute("aria-expanded", "true"); }
  catch (e) { holder.innerHTML = `<p class="err">${esc(e.message)}</p>`; }
}

// ---------------------------------------------------------------- logs
async function showLogs(target, container, previous) {
  const [ns, pod] = target.split("/"), dlg = $("#logs");
  $("#logs-title").textContent = `${ns}/${pod}`; $("#logs-body").textContent = "Loading…";
  if (!dlg.open) dlg.showModal();
  try {
    const q = `namespace=${encodeURIComponent(ns)}&pod=${encodeURIComponent(pod)}&previous=${previous}` + (container ? `&container=${encodeURIComponent(container)}` : "");
    const r = await api("/api/v1/logs?" + q);
    $("#logs-c").innerHTML = r.containers.map(c => `<option ${c === r.container ? "selected" : ""}>${esc(c)}</option>`).join("");
    $("#logs-body").innerHTML = r.lines.length ? r.lines.map(l => /error|exception|fatal|panic|forbidden|denied|refused|killed/i.test(l) ? `<span class="e">${esc(l)}</span>` : esc(l)).join("\n") : "(no log lines)";
  } catch (e) { $("#logs-body").textContent = e.message; }
  $("#logs-c").onchange = () => showLogs(target, $("#logs-c").value, $("#logs-prev").checked);
  $("#logs-prev").onchange = () => showLogs(target, $("#logs-c").value, $("#logs-prev").checked);
}
document.addEventListener("click", e => {
  const m = e.target.closest("[data-map]"); if (m) return toggleMap(m);
  const l = e.target.closest("[data-logs]"); if (l) { $("#logs-prev").checked = false; return showLogs(l.dataset.logs, null, false); }
});

function reportView(r) {
  const c = {critical:0, high:0, medium:0, low:0};
  r.findings.forEach(f => c[f.severity] = (c[f.severity] || 0) + 1);
  const problems = r.findings.filter(f => f.kind === "problem" && keepFinding(f)), risks = r.findings.filter(f => f.kind === "risk" && keepFinding(f));
  const incidents = (r.incidents || []).filter(keepIncident);
  const namespaces = [...new Set(r.findings.map(nsOf).filter(Boolean))].sort();
  return `<div class="stats">${["critical","high","medium","low"].map(k => `<div class="stat"><span class="sev ${k}">${k}</span><b>${c[k]}</b></div>`).join("")}
    <div class="stat">changes<b>${r.changes.length}</b></div></div>` + diagnosisCard(r.diagnosis) + filterBar(namespaces) +
    ((r.incidents || []).length ? `<h3>Incidents <span class="muted">(${incidents.length} of ${r.incidents.length})</span></h3>${incidents.map(i => incidentCard(i)).join("") || `<p class="muted">No incident matches the filters.</p>`}` : "") +
    `<div class="card"><h3>Problems</h3>${findingRows(problems)}</div>` +
    (r.changes.length ? `<div class="card"><h3>Recent changes</h3>${r.changes.slice(0, 15).map(ch => `<div class="change"><b>${esc(ch.time.slice(5,16).replace("T"," "))}</b> ${esc(ch.summary)}${ch.rollback_command ? `<pre>${esc(ch.rollback_command)}</pre>` : ""}</div>`).join("")}</div>` : "") +
    `<div class="card"><details><summary>${risks.length} configuration risks</summary>${findingRows(risks)}</details></div>` +
    r.warnings.map(w => `<p class="muted">! ${esc(w)}</p>`).join("");
}

// Rule-based results show at once; the LLM explanation is filled in when it arrives (local models can take minutes).
function paint(out, r) {
  lastReport = r;
  out.innerHTML = reportView(r) + (r.llm_pending ? `<p class="muted" id="llm-wait">AI explanation in progress… this page updates when it is ready.</p>` : "");
  bindFilters(out, () => paint(out, lastReport));
}
function showReport(out, r) {
  paint(out, r);
  if (!r.llm_pending) return;
  const poll = () => setTimeout(async () => {
    if (!document.body.contains(out) || !$("#llm-wait")) return;  // user moved on
    try {
      const next = await api("/api/v1/history/" + encodeURIComponent(r.id));
      if (next.llm_pending) return poll();
      paint(out, next);
    } catch (e) { const w = $("#llm-wait"); if (w) w.textContent = "AI explanation unavailable: " + e.message; }
  }, 5000);
  poll();
}

// ---------------------------------------------------------------- live: follows the background scans
function stopLive() { if (live) { live.abort.abort(); live = null; } }
async function readStream(onEvent, signal) {
  const headers = token ? {Authorization: "Bearer " + token} : {};
  const r = await fetch("/api/v1/stream", {headers, signal});
  if (r.status === 401) { token = prompt("API token (KUBESIFT_API_TOKEN):") || ""; try { sessionStorage.setItem("ko-token", token); } catch (e) {} return readStream(onEvent, signal); }
  if (!r.ok || !r.body) throw new Error(r.statusText || "stream failed");
  const reader = r.body.getReader(), dec = new TextDecoder(); let buf = "";
  for (;;) {
    const {value, done} = await reader.read(); if (done) return;
    buf += dec.decode(value, {stream: true}); let i;
    while ((i = buf.indexOf("\n\n")) >= 0) {
      const data = buf.slice(0, i).split("\n").filter(l => l.startsWith("data: ")).map(l => l.slice(6)).join("\n");
      buf = buf.slice(i + 2); if (data) onEvent(JSON.parse(data));
    }
  }
}
function liveView(st) {
  const ev = st.event;
  if (!ev) return `<p class="muted"><span class="live-dot"></span>Waiting for the next background scan…</p>`;
  if (!ev.live) return `<p class="muted">Live mode needs background scans: ${esc(ev.reason)}.</p>`;
  const active = ev.incidents.filter(keepIncident);
  const namespaces = [...new Set(ev.incidents.map(nsOf).filter(Boolean))].sort();
  const c = ev.counts || {};
  return `<p><span class="live-dot"></span><b>Live</b> <span class="muted">· ${esc(ev.cluster)} · last scan ${esc(String(ev.time).slice(11, 19))} UTC · updates by itself</span></p>
    <div class="stats">${["critical","high","medium","low"].map(k => `<div class="stat"><span class="sev ${k}">${k}</span><b>${c[k] || 0}</b></div>`).join("")}</div>` +
    filterBar(namespaces) + `<h3>Active incidents <span class="muted">(${active.length})</span></h3>` +
    (active.map(i => incidentCard(i, st.fresh.has(i.id) ? `<span class="chip on">new</span>` : "")).join("") || `<p class="ok">✓ No active incidents.</p>`) +
    (st.resolved.length ? `<h3>Resolved</h3>` + st.resolved.map(x => `<div class="card resolved"><span class="ok">✓ resolved ${esc(String(x.at).slice(11, 16))}</span> <b>${esc(x.inc.title)}</b></div>`).join("") : "");
}
function startLive(out) {
  stopLive();
  const st = {event: null, active: new Map(), resolved: [], fresh: new Set(), abort: new AbortController()};
  live = st;
  const draw = () => { if (live === st) { out.innerHTML = liveView(st); bindFilters(out, draw); } };
  const onEvent = ev => {
    if (ev.live) {
      const now = new Map(ev.incidents.map(i => [i.id, i]));
      st.fresh = new Set(st.event ? [...now.keys()].filter(id => !st.active.has(id)) : []);
      for (const [id, inc] of st.active) if (!now.has(id)) st.resolved.unshift({inc, at: ev.time});
      st.resolved = st.resolved.slice(0, 20); st.active = now;
    }
    st.event = ev; draw();
  };
  draw();
  const loop = async () => {
    while (live === st) {
      try { await readStream(onEvent, st.abort.signal); } catch (e) {
        if (live !== st) return;
        out.insertAdjacentHTML("afterbegin", `<p class="err">Live updates interrupted (${esc(e.message)}); retrying…</p>`);
      }
      if (st.event && !st.event.live) return;
      await new Promise(r => setTimeout(r, 5000));   // reconnect after a dropped connection
    }
  };
  loop();
}

const views = {
  Diagnose: () => `<div class="bar">${nsInput}<label><input type="checkbox" id="llm" checked> use LLM</label><button class="go" id="go">Diagnose</button>
    <label title="Follow the background scans: new incidents appear, fixed ones move to Resolved"><input type="checkbox" id="live"> Live</label></div><div id="out"></div>`,
  Ask: () => `<div class="bar"><input id="q" placeholder="Why is checkout failing in shop?" style="flex:1;min-width:240px">${nsInput}<button class="go" id="go">Ask</button></div><div id="out"></div>`,
  Changes: () => `<div class="bar">${nsInput}<select id="since"><option>1h</option><option>6h</option><option selected>24h</option><option>7d</option></select><button class="go" id="go">Show changes</button></div><div id="out"></div>`,
  Cost: () => `<div class="bar">${nsInput}<button class="go" id="go">Analyse cost</button></div><div id="out"></div>`,
  Upgrade: () => `<div class="bar"><input id="target" placeholder="target, e.g. 1.36" size="14"><button class="go" id="go">Check upgrade</button></div><div id="out"></div>`,
  Lint: () => `<div class="bar"><input id="target" placeholder="target version (optional)" size="20"><button class="go" id="go">Lint</button></div><textarea id="yaml" placeholder="Paste Kubernetes YAML (multi-document is fine)"></textarea><div id="out"></div>`,
  History: () => `<div id="out"></div>`,
};

const actions = {
  Diagnose: out => api("/api/v1/diagnose", {method: "POST", body: JSON.stringify({namespace: $("#ns").value || null, llm: $("#llm").checked, wait_for_llm: false})}).then(r => showReport(out, r)),
  Ask: out => api("/api/v1/ask", {method: "POST", body: JSON.stringify({question: $("#q").value, namespace: $("#ns").value || null})})
    .then(r => out.innerHTML = `<div class="card"><h3>${esc(r.answer.answer)}</h3><p class="muted">${r.answer.confidence}% confidence · ${esc(r.answer.generated_by)}</p>${(r.answer.commands||[]).map(c => `<pre>${esc(c)}</pre>`).join("")}${(r.answer.follow_up||[]).map(x => `<div>→ ${esc(x)}</div>`).join("")}</div><div class="card"><h3>Supporting findings</h3>${findingRows(r.report.findings)}</div>`),
  Changes: out => api(`/api/v1/changes?since=${$("#since").value}${$("#ns").value ? "&namespace=" + encodeURIComponent($("#ns").value) : ""}`)
    .then(cs => out.innerHTML = `<div class="card">${cs.length ? cs.map(c => `<div class="change"><b>${esc(c.time.slice(5,16).replace("T"," "))}</b> <span class="muted">${esc(c.kind)}</span> ${esc(c.summary)}${c.details.map(d => `<div class="muted">${esc(d)}</div>`).join("")}${c.rollback_command ? `<pre>${esc(c.rollback_command)}</pre>` : ""}</div>`).join("") : "No changes in this window."}</div>`),
  Cost: out => api(`/api/v1/cost${$("#ns").value ? "?namespace=" + encodeURIComponent($("#ns").value) : ""}`).then(d => out.innerHTML =
    `<div class="stats"><div class="stat">nodes<b>${d.cluster.nodes}</b></div><div class="stat">compute/month<b>$${d.cluster.monthly_compute_estimate.toLocaleString()}</b></div><div class="stat">possible savings<b class="ok">$${d.totals.monthly_savings.toLocaleString()}</b></div></div>
    <p class="muted">${esc(d.source)}</p><div class="card"><h3>Right-sizing</h3><table><tr><th>Workload</th><th>CPU req → used → suggest</th><th>Memory req → used → suggest</th><th>$/mo</th></tr>${d.rightsizing.map(i => `<tr><td><code>${esc(i.workload)}</code> ${esc(i.container)}</td><td>${esc(i.cpu_request_h)} → ${esc(i.cpu_used_h)} → <b>${esc(i.recommend_cpu)}</b></td><td>${esc(i.mem_request_h)} → ${esc(i.mem_used_h)} → <b>${esc(i.recommend_memory)}</b><div class="err">${esc(i.note)}</div></td><td>${i.monthly_savings}</td></tr>`).join("")}</table></div>
    <div class="card"><h3>Waste</h3>${d.waste.map(w => `<div>${esc(w.type)}: <code>${esc(w.resource)}</code> ${esc(w.detail)} ($${w.monthly_cost}/mo)</div>`).join("") || "None found."}</div>${d.warnings.map(w => `<p class="muted">! ${esc(w)}</p>`).join("")}`),
  Upgrade: out => api(`/api/v1/upgrade?target=${encodeURIComponent($("#target").value)}`).then(d => out.innerHTML =
    `<div class="card"><h3>${esc(d.current)} → ${esc(d.target)}: ${d.ready ? `<span class="ok">no blockers</span>` : `<span class="err">${d.blockers.length} blocker(s)</span>`}</h3>${d.notes.map(n => `<div>• ${esc(n)}</div>`).join("")}${d.steps.map(s => `<div class="muted">→ ${esc(s)}</div>`).join("")}</div>
    <div class="card"><h3>Blockers</h3>${findingRows(d.blockers)}</div><div class="card"><h3>Warnings</h3>${findingRows(d.warnings)}</div>`),
  Lint: out => api("/api/v1/lint", {method: "POST", body: JSON.stringify({manifests: $("#yaml").value, target_version: $("#target").value || null})}).then(fs => out.innerHTML = `<div class="card">${findingRows(fs)}</div>`),
};

async function render() {
  stopLive();
  $("#main").innerHTML = views[current]();
  if (current === "History") {
    const out = $("#out");
    try {
      const rows = await api("/api/v1/history");
      out.innerHTML = `<div class="card"><table><tr><th>When (UTC)</th><th>Cluster</th><th class="hide-sm">Source</th><th>Crit/High</th><th>Summary</th></tr>${rows.map(r => `<tr data-id="${esc(r.id)}" style="cursor:pointer"><td>${esc(r.created.slice(0,16).replace("T"," "))}</td><td>${esc(r.cluster)}<div class="muted">${esc(r.namespace || "all")}</div></td><td class="hide-sm">${esc(r.source)}</td><td>${r.counts.critical || 0}/${r.counts.high || 0}</td><td>${esc(r.question || r.summary)}</td></tr>`).join("")}</table></div>`;
      out.querySelectorAll("tr[data-id]").forEach(tr => tr.onclick = async () => showReport(out, await api("/api/v1/history/" + tr.dataset.id)));
    } catch (e) { out.innerHTML = `<p class="err">${esc(e.message)}</p>`; }
    return;
  }
  const btn = $("#go"); btn.onclick = () => run(btn, actions[current]);
  const q = $("#q"); if (q) q.onkeydown = e => { if (e.key === "Enter") btn.click(); };
  const lv = $("#live"); if (lv) lv.onchange = () => { if (lv.checked) { btn.disabled = true; startLive($("#out")); } else { stopLive(); btn.disabled = false; $("#out").innerHTML = ""; } };
}

api("/api/v1/info").then(i => { INFO = i; $("#meta").textContent = `v${i.version} · LLM: ${i.llm === "none" ? "off (rules only)" : i.llm + " / " + i.model}`; }).catch(() => {});
$("#logs-close").onclick = () => $("#logs").close();
nav(); render();
</script>
</body>
</html>
