<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>KubeSift</title>
<style>
:root{--bg:#f6f7f9;--panel:#fff;--text:#1b1f24;--muted:#5d6672;--line:#e3e6ea;--accent:#4b5bdc;
--crit:#c62828;--high:#e65100;--med:#b58900;--low:#0277bd;--info:#6b7280;--ok:#2e7d32;--code:#f0f2f5}
@media (prefers-color-scheme:dark){:root{--bg:#0f1216;--panel:#171b21;--text:#e6e9ee;--muted:#9aa4b2;--line:#262c35;
--accent:#8b96ff;--code:#1f252d;--crit:#ef5350;--high:#ff8a50;--med:#e0c050;--low:#4fc3f7;--ok:#66bb6a}}
*{box-sizing:border-box}body{margin:0;font:14px/1.5 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--text)}
header{display:flex;gap:16px;align-items:center;padding:12px 20px;border-bottom:1px solid var(--line);background:var(--panel);flex-wrap:wrap}
header h1{font-size:17px;margin:0}header .meta{color:var(--muted);font-size:12px}
nav{display:flex;gap:4px;flex-wrap:wrap}nav button{background:none;border:0;padding:6px 12px;border-radius:6px;color:var(--muted);cursor:pointer;font:inherit}
nav button.on{background:var(--code);color:var(--text);font-weight:600}
main{max-width:1180px;margin:0 auto;padding:20px 16px}
.bar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px;align-items:center}
input,select,textarea{font:inherit;padding:7px 10px;border:1px solid var(--line);border-radius:6px;background:var(--panel);color:var(--text)}
textarea{width:100%;min-height:220px;font-family:ui-monospace,Consolas,monospace;font-size:12px}
button.go{background:var(--accent);color:#fff;border:0;padding:8px 14px;border-radius:6px;cursor:pointer;font-weight:600}
button.go:disabled{opacity:.5;cursor:wait}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:16px;margin-bottom:14px}
.card h3{margin:0 0 6px;font-size:15px}.muted{color:var(--muted)}
.sev{display:inline-block;min-width:68px;text-align:center;font-size:11px;font-weight:700;padding:2px 6px;border-radius:4px;color:#fff;text-transform:uppercase}
.critical{background:var(--crit)}.high{background:var(--high)}.medium{background:var(--med)}.low{background:var(--low)}.info{background:var(--info)}
table{width:100%;border-collapse:collapse}td,th{text-align:left;padding:8px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:12px;color:var(--muted);font-weight:600}
code,pre{font-family:ui-monospace,Consolas,monospace;font-size:12px;background:var(--code);border-radius:4px}
code{padding:1px 5px}pre{padding:8px;white-space:pre-wrap;word-break:break-word;margin:6px 0}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin-bottom:14px}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px}.stat b{font-size:22px;display:block}
.change{border-left:3px solid var(--accent);padding-left:8px;margin:6px 0}
.ok{color:var(--ok);font-weight:600}.err{color:var(--crit)}details summary{cursor:pointer;color:var(--muted)}
@media (max-width:640px){td,th{padding:6px 4px}.hide-sm{display:none}}
</style>
</head>
<body>
<header>
  <h1>KubeSift</h1><span class="meta" id="meta"></span>
  <nav id="nav"></nav>
</header>
<main id="main"></main>
<script>
const TABS = ["Diagnose", "Ask", "Changes", "Cost", "Upgrade", "Lint", "History"];
const $ = (s, el = document) => el.querySelector(s);
const esc = v => String(v ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
let token = ""; try { token = sessionStorage.getItem("ko-token") || ""; } catch (e) {}
let current = "Diagnose";

async function api(path, opts = {}) {
  const headers = {"Content-Type": "application/json"};
  if (token) headers.Authorization = "Bearer " + token;
  const r = await fetch(path, {...opts, headers});
  if (r.status === 401) {
    token = prompt("API token (KUBESIFT_API_TOKEN):") || "";
    try { sessionStorage.setItem("ko-token", token); } catch (e) {}
    return api(path, opts);
  }
  const body = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(body.detail || r.statusText);
  return body;
}

function nav() {
  $("#nav").innerHTML = TABS.map(t => `<button class="${t === current ? "on" : ""}" data-t="${t}">${t}</button>`).join("");
  $("#nav").querySelectorAll("button").forEach(b => b.onclick = () => { current = b.dataset.t; nav(); render(); });
}
const sev = s => `<span class="sev ${esc(s)}">${esc(s)}</span>`;
const nsInput = `<input id="ns" placeholder="namespace (all)" size="16">`;
async function run(btn, fn) {
  btn.disabled = true; const out = $("#out"); out.innerHTML = `<p class="muted">Working…</p>`;
  try { await fn(out); } catch (e) { out.innerHTML = `<p class="err">${esc(e.message)}</p>`; }
  btn.disabled = false;
}

function findingRows(fs) {
  if (!fs.length) return `<p class="ok">✓ Nothing found.</p>`;
  return `<table><tr><th>Severity</th><th>Resource</th><th>Finding</th></tr>` + fs.map(f => `<tr><td>${sev(f.severity)}</td>
  <td><code>${esc(f.owner ? `${f.owner.kind}/${f.owner.namespace || ""}/${f.owner.name}` : f.resource.name)}</code><div class="muted">${esc(f.check)}</div></td>
  <td>${esc(f.message)}${(f.related_changes || []).slice(0,1).map(c => `<div class="change">after: ${esc(c.summary)}</div>`).join("")}
  <details><summary>evidence &amp; fix</summary>${(f.evidence||[]).map(e => `<div class="muted">• ${esc(e)}</div>`).join("")}
  ${f.remediation ? `<p><b>Fix:</b> ${esc(f.remediation)}</p>` : ""}${(f.commands||[]).map(c => `<pre>${esc(c)}</pre>`).join("")}
  ${(f.notes||[]).map(n => `<div>📝 ${esc(n)}</div>`).join("")}</details></td></tr>`).join("") + `</table>`;
}

function diagnosisCard(d) {
  if (!d) return "";
  return `<div class="card"><h3>Diagnosis <span class="muted">(${esc(d.generated_by)})</span></h3><p>${esc(d.summary)}</p>` +
    d.root_causes.map((rc, i) => `<div class="card"><b>${i + 1}. ${esc(rc.title)}</b> <span class="muted">${rc.confidence}% confidence</span>
    <p>${esc(rc.explanation)}</p>${rc.fix_steps.map(s => `<div>→ ${esc(s)}</div>`).join("")}${rc.commands.map(c => `<pre>${esc(c)}</pre>`).join("")}</div>`).join("") +
    (d.next_checks.length ? `<p class="muted">Next: ${d.next_checks.map(esc).join("; ")}</p>` : "") + `</div>`;
}

function reportView(r) {
  const c = {critical:0, high:0, medium:0, low:0};
  r.findings.forEach(f => c[f.severity] = (c[f.severity] || 0) + 1);
  const problems = r.findings.filter(f => f.kind === "problem"), risks = r.findings.filter(f => f.kind === "risk");
  return `<div class="stats">${["critical","high","medium","low"].map(k => `<div class="stat"><span class="sev ${k}">${k}</span><b>${c[k]}</b></div>`).join("")}
    <div class="stat">changes<b>${r.changes.length}</b></div></div>` + diagnosisCard(r.diagnosis) +
    `<div class="card"><h3>Problems</h3>${findingRows(problems)}</div>` +
    (r.changes.length ? `<div class="card"><h3>Recent changes</h3>${r.changes.slice(0, 15).map(ch => `<div class="change"><b>${esc(ch.time.slice(5,16).replace("T"," "))}</b> ${esc(ch.summary)}${ch.rollback_command ? `<pre>${esc(ch.rollback_command)}</pre>` : ""}</div>`).join("")}</div>` : "") +
    `<div class="card"><details><summary>${risks.length} configuration risks</summary>${findingRows(risks)}</details></div>` +
    r.warnings.map(w => `<p class="muted">! ${esc(w)}</p>`).join("");
}

// Rule-based results show at once; the LLM explanation is filled in when it arrives (local models can take minutes).
function showReport(out, r) {
  out.innerHTML = reportView(r) + (r.llm_pending ? `<p class="muted" id="llm-wait">AI explanation in progress… this page updates when it is ready.</p>` : "");
  if (!r.llm_pending) return;
  const poll = () => setTimeout(async () => {
    if (!document.body.contains(out) || !$("#llm-wait")) return;  // user moved on
    try {
      const next = await api("/api/v1/history/" + encodeURIComponent(r.id));
      if (next.llm_pending) return poll();
      out.innerHTML = reportView(next);
    } catch (e) { const w = $("#llm-wait"); if (w) w.textContent = "AI explanation unavailable: " + e.message; }
  }, 5000);
  poll();
}

const views = {
  Diagnose: () => `<div class="bar">${nsInput}<label><input type="checkbox" id="llm" checked> use LLM</label><button class="go" id="go">Diagnose</button></div><div id="out"></div>`,
  Ask: () => `<div class="bar"><input id="q" placeholder="Why is checkout failing in shop?" style="flex:1;min-width:240px">${nsInput}<button class="go" id="go">Ask</button></div><div id="out"></div>`,
  Changes: () => `<div class="bar">${nsInput}<select id="since"><option>1h</option><option>6h</option><option selected>24h</option><option>7d</option></select><button class="go" id="go">Show changes</button></div><div id="out"></div>`,
  Cost: () => `<div class="bar">${nsInput}<button class="go" id="go">Analyse cost</button></div><div id="out"></div>`,
  Upgrade: () => `<div class="bar"><input id="target" placeholder="target, e.g. 1.36" size="14"><button class="go" id="go">Check upgrade</button></div><div id="out"></div>`,
  Lint: () => `<div class="bar"><input id="target" placeholder="target version (optional)" size="20"><button class="go" id="go">Lint</button></div><textarea id="yaml" placeholder="Paste Kubernetes YAML (multi-document is fine)"></textarea><div id="out"></div>`,
  History: () => `<div id="out"></div>`,
};

const actions = {
  Diagnose: out => api("/api/v1/diagnose", {method: "POST", body: JSON.stringify({namespace: $("#ns").value || null, llm: $("#llm").checked, wait_for_llm: false})}).then(r => showReport(out, r)),
  Ask: out => api("/api/v1/ask", {method: "POST", body: JSON.stringify({question: $("#q").value, namespace: $("#ns").value || null})})
    .then(r => out.innerHTML = `<div class="card"><h3>${esc(r.answer.answer)}</h3><p class="muted">${r.answer.confidence}% confidence · ${esc(r.answer.generated_by)}</p>${(r.answer.commands||[]).map(c => `<pre>${esc(c)}</pre>`).join("")}${(r.answer.follow_up||[]).map(x => `<div>→ ${esc(x)}</div>`).join("")}</div><div class="card"><h3>Supporting findings</h3>${findingRows(r.report.findings)}</div>`),
  Changes: out => api(`/api/v1/changes?since=${$("#since").value}${$("#ns").value ? "&namespace=" + encodeURIComponent($("#ns").value) : ""}`)
    .then(cs => out.innerHTML = `<div class="card">${cs.length ? cs.map(c => `<div class="change"><b>${esc(c.time.slice(5,16).replace("T"," "))}</b> <span class="muted">${esc(c.kind)}</span> ${esc(c.summary)}${c.details.map(d => `<div class="muted">${esc(d)}</div>`).join("")}${c.rollback_command ? `<pre>${esc(c.rollback_command)}</pre>` : ""}</div>`).join("") : "No changes in this window."}</div>`),
  Cost: out => api(`/api/v1/cost${$("#ns").value ? "?namespace=" + encodeURIComponent($("#ns").value) : ""}`).then(d => out.innerHTML =
    `<div class="stats"><div class="stat">nodes<b>${d.cluster.nodes}</b></div><div class="stat">compute/month<b>$${d.cluster.monthly_compute_estimate.toLocaleString()}</b></div><div class="stat">possible savings<b class="ok">$${d.totals.monthly_savings.toLocaleString()}</b></div></div>
    <p class="muted">${esc(d.source)}</p><div class="card"><h3>Right-sizing</h3><table><tr><th>Workload</th><th>CPU req → used → suggest</th><th>Memory req → used → suggest</th><th>$/mo</th></tr>${d.rightsizing.map(i => `<tr><td><code>${esc(i.workload)}</code> ${esc(i.container)}</td><td>${esc(i.cpu_request_h)} → ${esc(i.cpu_used_h)} → <b>${esc(i.recommend_cpu)}</b></td><td>${esc(i.mem_request_h)} → ${esc(i.mem_used_h)} → <b>${esc(i.recommend_memory)}</b><div class="err">${esc(i.note)}</div></td><td>${i.monthly_savings}</td></tr>`).join("")}</table></div>
    <div class="card"><h3>Waste</h3>${d.waste.map(w => `<div>${esc(w.type)}: <code>${esc(w.resource)}</code> ${esc(w.detail)} ($${w.monthly_cost}/mo)</div>`).join("") || "None found."}</div>${d.warnings.map(w => `<p class="muted">! ${esc(w)}</p>`).join("")}`),
  Upgrade: out => api(`/api/v1/upgrade?target=${encodeURIComponent($("#target").value)}`).then(d => out.innerHTML =
    `<div class="card"><h3>${esc(d.current)} → ${esc(d.target)}: ${d.ready ? `<span class="ok">no blockers</span>` : `<span class="err">${d.blockers.length} blocker(s)</span>`}</h3>${d.notes.map(n => `<div>• ${esc(n)}</div>`).join("")}${d.steps.map(s => `<div class="muted">→ ${esc(s)}</div>`).join("")}</div>
    <div class="card"><h3>Blockers</h3>${findingRows(d.blockers)}</div><div class="card"><h3>Warnings</h3>${findingRows(d.warnings)}</div>`),
  Lint: out => api("/api/v1/lint", {method: "POST", body: JSON.stringify({manifests: $("#yaml").value, target_version: $("#target").value || null})}).then(fs => out.innerHTML = `<div class="card">${findingRows(fs)}</div>`),
};

async function render() {
  $("#main").innerHTML = views[current]();
  if (current === "History") {
    const out = $("#out");
    try {
      const rows = await api("/api/v1/history");
      out.innerHTML = `<div class="card"><table><tr><th>When (UTC)</th><th>Cluster</th><th class="hide-sm">Source</th><th>Crit/High</th><th>Summary</th></tr>${rows.map(r => `<tr data-id="${esc(r.id)}" style="cursor:pointer"><td>${esc(r.created.slice(0,16).replace("T"," "))}</td><td>${esc(r.cluster)}<div class="muted">${esc(r.namespace || "all")}</div></td><td class="hide-sm">${esc(r.source)}</td><td>${r.counts.critical || 0}/${r.counts.high || 0}</td><td>${esc(r.question || r.summary)}</td></tr>`).join("")}</table></div>`;
      out.querySelectorAll("tr[data-id]").forEach(tr => tr.onclick = async () => showReport(out, await api("/api/v1/history/" + tr.dataset.id)));
    } catch (e) { out.innerHTML = `<p class="err">${esc(e.message)}</p>`; }
    return;
  }
  const btn = $("#go"); btn.onclick = () => run(btn, actions[current]);
  const q = $("#q"); if (q) q.onkeydown = e => { if (e.key === "Enter") btn.click(); };
}

api("/api/v1/info").then(i => $("#meta").textContent = `v${i.version} · LLM: ${i.llm === "none" ? "off (rules only)" : i.llm + " / " + i.model}`).catch(() => {});
nav(); render();
</script>
</body>
</html>
