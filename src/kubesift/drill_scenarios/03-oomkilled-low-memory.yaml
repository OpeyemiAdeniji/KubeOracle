apiVersion: apps/v1
kind: Deployment
metadata:
  name: oomkilled-test
  labels:
    scenario: oomkilled-low-memory
spec:
  replicas: 1
  selector:
    matchLabels:
      app: oomkilled-test
  template:
    metadata:
      labels:
        app: oomkilled-test
    spec:
      containers:
        - name: app
          image: python:3.12-slim
          command: ["python", "-c", "x = ' ' * (512 * 1024 * 1024)"]
          resources:
            limits:
              memory: "32Mi"
              cpu: "100m"
