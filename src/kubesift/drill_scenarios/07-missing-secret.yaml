apiVersion: apps/v1
kind: Deployment
metadata:
  name: secret-test
  labels:
    scenario: missing-secret
spec:
  replicas: 1
  selector:
    matchLabels:
      app: secret-test
  template:
    metadata:
      labels:
        app: secret-test
    spec:
      containers:
        - name: app
          image: nginx:stable
          env:
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: db-credentials
                  key: password
          resources:
            requests: {cpu: 10m, memory: 32Mi}
            limits: {memory: 64Mi}
